<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
<title id="t">Model domeny kontekstu Transfery</title>
<desc id="d">Agregat Przelew z encją WpisAudytu i obiektami wartości oraz integracja z kontekstami Zarządzanie kontem i Uwierzytelnianie.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/></marker></defs>
<style>text{font-family:sans-serif;fill:#243b53}.h{font-weight:700;font-size:15px;fill:#102a43}.l{font-size:13px}.s{font-size:12px;fill:#486581}</style>
<rect x="30" y="20" width="1040" height="600" rx="18" fill="#f7f9fc" stroke="#243b53" stroke-width="3"/>
<text x="550" y="55" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#102a43">Bounded Context: Transfery</text>
<rect x="60" y="75" width="620" height="500" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="370" y="105" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#102a43">Agregat: Przelew</text>
<text x="370" y="125" text-anchor="middle" class="s">korzeń: Przelew</text>
<rect x="90" y="150" width="300" height="130" rx="8" fill="#fff" stroke="#334e68" stroke-width="2"/>
<text class="h" x="102" y="176">Przelew</text>
<text class="l" x="102" y="200">id, klucz idempotentności</text>
<text class="l" x="102" y="220">konto źródłowe (tylko ID)</text>
<text class="l" x="102" y="240">kwota, tytuł, odbiorca</text>
<text class="l" x="102" y="260">status, wersja</text>
<rect x="430" y="150" width="220" height="130" rx="8" fill="#fff" stroke="#334e68" stroke-width="2"/>
<text class="h" x="442" y="176">WpisAudytu</text>
<text class="l" x="442" y="200">status z / status do</text>
<text class="l" x="442" y="220">czas zdarzenia (UTC)</text>
<text class="l" x="442" y="240">powód zmiany</text>
<rect x="90" y="330" width="190" height="90" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text class="h" x="102" y="356">Kwota</text>
<text class="l" x="102" y="380">decimal, 2 miejsca</text>
<text class="l" x="102" y="400">kod waluty ISO 4217</text>
<rect x="300" y="330" width="190" height="90" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text class="h" x="312" y="356">Odbiorca</text>
<text class="l" x="312" y="380">Iban + nazwa</text>
<text class="l" x="312" y="400">maks. 70 znaków</text>
<rect x="510" y="330" width="140" height="90" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text class="h" x="522" y="356">Iban</text>
<text class="l" x="522" y="380">mod-97</text>
<text class="l" x="522" y="400">15-34 znaki</text>
<rect x="90" y="450" width="190" height="90" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text class="h" x="102" y="476">TytulPrzelewu</text>
<text class="l" x="102" y="500">1-140 znaków</text>
<text class="l" x="102" y="520">biała lista znaków</text>
<rect x="300" y="450" width="190" height="90" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text class="h" x="312" y="476">StatusPrzelewu</text>
<text class="l" x="312" y="500">enum, 5 stanów</text>
<text class="l" x="312" y="520">UTWORZONY → WYKONANY</text>
<rect x="510" y="450" width="140" height="90" rx="8" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
<text class="h" x="522" y="476">IdempotencyKey</text>
<text class="l" x="522" y="500">UUID</text>
<text class="l" x="522" y="520">unikalny</text>
<rect x="740" y="150" width="290" height="110" rx="8" fill="#edf2f7" stroke="#52606d" stroke-width="2" stroke-dasharray="8 5"/>
<text class="h" x="752" y="176">Zewn.: Zarządzanie kontem</text>
<text class="l" x="752" y="200">status i właściciel konta</text>
<text class="l" x="752" y="220">księgowanie (debet/kredyt)</text>
<rect x="740" y="330" width="290" height="110" rx="8" fill="#edf2f7" stroke="#52606d" stroke-width="2" stroke-dasharray="8 5"/>
<text class="h" x="752" y="356">Zewn.: Uwierzytelnianie</text>
<text class="l" x="752" y="380">silne uwierzytelnienie (SCA)</text>
<text class="l" x="752" y="400">powiązane z kwotą i odbiorcą</text>
