<path d="M490 375 L510 375" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M680 205 L740 205" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/>
