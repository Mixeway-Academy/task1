<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Model DDD przelewu krajowego</title>
  <desc id="desc">Trzy konteksty: Tożsamość i autoryzacja, Rachunki oraz Przelewy. Pokazano agregaty, encje, obiekty wartości i komunikację pomiędzy kontekstami.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#50627c"/></marker>
  </defs>
  <rect width="1440" height="760" fill="#f4f7fb"/>
  <text x="42" y="58" fill="#14233b" font-family="Arial, sans-serif" font-size="30" font-weight="700">Przelew krajowy - granice modelu</text>
  <text x="42" y="88" fill="#52647c" font-family="Arial, sans-serif" font-size="16">5 encji, 4 agregaty i obiekty wartości. Komunikacja między kontekstami używa identyfikatorów i zdarzeń.</text>

  <rect x="40" y="120" width="410" height="460" rx="18" fill="#ffffff" stroke="#a9b9d1" stroke-width="2"/>
  <rect x="40" y="120" width="410" height="66" rx="18" fill="#d9e7fb"/>
  <rect x="40" y="168" width="410" height="18" fill="#d9e7fb"/>
  <text x="65" y="160" fill="#183a68" font-family="Arial, sans-serif" font-size="22" font-weight="700">Tożsamość i autoryzacja</text>
  <rect x="65" y="210" width="360" height="180" rx="11" fill="#edf4ff" stroke="#4f79b8" stroke-width="2"/>
  <text x="84" y="239" fill="#173a67" font-family="Arial, sans-serif" font-size="17" font-weight="700">Klient</text>
  <text x="84" y="264" fill="#405776" font-family="Arial, sans-serif" font-size="14">korzeń agregatu, encja</text>
  <text x="84" y="286" fill="#405776" font-family="Arial, sans-serif" font-size="14">KlientId, email, status</text>
  <rect x="84" y="305" width="322" height="67" rx="11" fill="#f7faff" stroke="#90a9ce" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="103" y="332" fill="#173a67" font-family="Arial, sans-serif" font-size="16" font-weight="700">Adres</text>
  <text x="103" y="355" fill="#405776" font-family="Arial, sans-serif" font-size="14">obiekt wartości klienta</text>
  <rect x="65" y="408" width="360" height="126" rx="11" fill="#edf4ff" stroke="#4f79b8" stroke-width="2"/>
  <text x="84" y="437" fill="#173a67" font-family="Arial, sans-serif" font-size="17" font-weight="700">AutoryzacjaPrzelewu</text>
  <text x="84" y="462" fill="#405776" font-family="Arial, sans-serif" font-size="14">korzeń agregatu, encja</text>
  <text x="84" y="484" fill="#405776" font-family="Arial, sans-serif" font-size="14">PrzelewId, ważność, liczba prób</text>
  <text x="84" y="506" fill="#405776" font-family="Arial, sans-serif" font-size="14">skrót niezmiennych danych przelewu</text>

  <rect x="515" y="120" width="410" height="460" rx="18" fill="#ffffff" stroke="#a5cfbd" stroke-width="2"/>
  <rect x="515" y="120" width="410" height="66" rx="18" fill="#dbf3e7"/>
  <rect x="515" y="168" width="410" height="18" fill="#dbf3e7"/>
  <text x="540" y="160" fill="#1d6049" font-family="Arial, sans-serif" font-size="22" font-weight="700">Rachunki</text>
  <rect x="540" y="210" width="360" height="324" rx="11" fill="#ecfbf3" stroke="#529a78" stroke-width="2"/>
  <text x="559" y="239" fill="#205b45" font-family="Arial, sans-serif" font-size="17" font-weight="700">KontoBankowe</text>
  <text x="559" y="264" fill="#406454" font-family="Arial, sans-serif" font-size="14">korzeń agregatu, encja</text>
  <text x="559" y="286" fill="#406454" font-family="Arial, sans-serif" font-size="14">IBAN, KlientId, salda, wersja</text>
  <text x="559" y="308" fill="#406454" font-family="Arial, sans-serif" font-size="14">rezerwuj(), rozlicz(), zwolnij()</text>
  <rect x="559" y="332" width="322" height="67" rx="11" fill="#f7fcf9" stroke="#8cbea4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="578" y="359" fill="#205b45" font-family="Arial, sans-serif" font-size="16" font-weight="700">NumerRachunku, Pieniadze</text>
  <text x="578" y="382" fill="#406454" font-family="Arial, sans-serif" font-size="14">obiekty wartości</text>
  <rect x="559" y="414" width="322" height="102" rx="11" fill="#ffffff" stroke="#529a78" stroke-width="2"/>
  <text x="578" y="443" fill="#205b45" font-family="Arial, sans-serif" font-size="17" font-weight="700">RezerwacjaSrodkow</text>
  <text x="578" y="468" fill="#406454" font-family="Arial, sans-serif" font-size="14">encja wewnętrzna</text>
  <text x="578" y="490" fill="#406454" font-family="Arial, sans-serif" font-size="14">PrzelewId, kwota, status</text>

  <rect x="990" y="120" width="410" height="460" rx="18" fill="#ffffff" stroke="#d8b894" stroke-width="2"/>
  <rect x="990" y="120" width="410" height="66" rx="18" fill="#fff0db"/>
  <rect x="990" y="168" width="410" height="18" fill="#fff0db"/>
  <text x="1015" y="160" fill="#8a511d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Przelewy</text>
  <rect x="1015" y="210" width="360" height="324" rx="11" fill="#fff8ed" stroke="#c28b54" stroke-width="2"/>
  <text x="1034" y="239" fill="#7f4b1b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Przelew</text>
  <text x="1034" y="264" fill="#6e5c45" font-family="Arial, sans-serif" font-size="14">korzeń agregatu, encja</text>
  <text x="1034" y="286" fill="#6e5c45" font-family="Arial, sans-serif" font-size="14">PrzelewId, KlientId, status</text>
  <text x="1034" y="308" fill="#6e5c45" font-family="Arial, sans-serif" font-size="14">rachunek źródłowy, tytuł</text>
  <text x="1034" y="330" fill="#6e5c45" font-family="Arial, sans-serif" font-size="14">kwota, odbiorca, klucz idempotencji</text>
  <text x="1034" y="360" fill="#8a511d" font-family="Arial, sans-serif" font-size="14">utwórz() → autoryzuj() → zaksięguj()</text>
  <rect x="1034" y="410" width="322" height="106" rx="11" fill="#fffcf6" stroke="#d5b48c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1053" y="438" fill="#7f4b1b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Obiekty wartości</text>
  <text x="1053" y="465" fill="#6e5c45" font-family="Arial, sans-serif" font-size="14">KwotaPrzelewu, Odbiorca</text>
  <text x="1053" y="489" fill="#6e5c45" font-family="Arial, sans-serif" font-size="14">NumerRachunku</text>

  <path d="M450 631 H989" fill="none" stroke="#50627c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="484" y="622" fill="#40536d" font-family="Arial, sans-serif" font-size="15">AutoryzacjaPotwierdzona(PrzelewId, skrotZlecenia)</text>
  <path d="M1195 673 H720" fill="none" stroke="#50627c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="858" y="660" fill="#40536d" font-family="Arial, sans-serif" font-size="15">ZarezerwujSrodki</text>
  <path d="M720 711 H1195" fill="none" stroke="#50627c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="836" y="735" fill="#40536d" font-family="Arial, sans-serif" font-size="15">ObciazenieZaksiegowane</text>
  <text x="42" y="724" fill="#63758d" font-family="Arial, sans-serif" font-size="14">Wewnątrz kontekstów: ramka ciągła - encja lub agregat; przerywana - obiekt wartości.</text>
</svg>
